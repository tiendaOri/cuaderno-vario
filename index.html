<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Cuaderno de obra Vario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: cuaderno de taller en una columna pensada para el móvil. Cabecera fija arriba, secciones en tarjetas, barra inferior con cinco áreas. */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --surface2:#E2E8E5; --line:#C8D1CD;
  --ink:#16201C; --ink2:#4A5A54; --accent:#0B6B8A; --accent-ink:#FFFFFF; --accent-soft:#CDE5EE;
  --ok:#2B7A4B; --warn:#A8690F; --bad:#B03A2A;
  --c-trat:#B4572D; --c-acus:#4A4F57; --c-aisl:#D9B53F; --c-barr:#9AA7B0; --c-rast:#8A5A33; --c-pane:#D2B48C; --c-otro:#7A6AA8;
  --chapa:#6B7780;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101618; --surface:#182125; --surface2:#222F34; --line:#2E3D43;
    --ink:#E6EEEA; --ink2:#9DB0A8; --accent:#4DB8DA; --accent-ink:#06222C; --accent-soft:#1B3A45;
    --ok:#5FBF86; --warn:#E0A94A; --bad:#E57C69;
    --c-trat:#D77A4C; --c-acus:#8A909A; --c-aisl:#E3C65F; --c-barr:#B4C0C8; --c-rast:#B07B4C; --c-pane:#D8BE96; --c-otro:#A598D0;
    --chapa:#8A96A0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101618; --surface:#182125; --surface2:#222F34; --line:#2E3D43;
  --ink:#E6EEEA; --ink2:#9DB0A8; --accent:#4DB8DA; --accent-ink:#06222C; --accent-soft:#1B3A45;
  --ok:#5FBF86; --warn:#E0A94A; --bad:#E57C69;
  --c-trat:#D77A4C; --c-acus:#8A909A; --c-aisl:#E3C65F; --c-barr:#B4C0C8; --c-rast:#B07B4C; --c-pane:#D8BE96; --c-otro:#A598D0;
  --chapa:#8A96A0; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
body.noscroll{overflow:hidden}
#app{max-width:760px;margin:0 auto}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top .eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.top h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.top .tmeta{font-size:13px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:15px}
.btn:disabled{opacity:.55}
.btn:focus-visible,.chip:focus-visible,.icon:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:40px;height:40px;flex:none;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:18px;line-height:1;padding:0}
.icon.sm{width:36px;height:36px}
.dotb{position:relative}
.dotb::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
h3.sub{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.03em}
.hint{font-size:14px;color:var(--ink2)}
.muted{color:var(--ink2)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:8px;color:var(--ink2);font-size:15px;text-align:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span:first-child,.fld>.lbl{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-height:44px;min-width:0}
textarea{resize:vertical;min-height:88px}
input[type=range]{padding:0;min-height:36px;accent-color:var(--accent)}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
input[type=file]{padding:8px;font-size:14px}
.num{position:relative;display:block}
.num input{padding-right:38px}
.num .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--ink2);pointer-events:none}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip b{font-weight:700;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;background:var(--warn);color:#fff;padding:0 5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tl{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tile .tv{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .tv small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:3px}
.tile.warn .tv{color:var(--warn)} .tile.bad .tv{color:var(--bad)} .tile.ok .tv{color:var(--ok)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .main b{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:14px;color:var(--ink2)}
.item .btns{display:flex;gap:6px;flex:none}
.item.done .main b{text-decoration:line-through;color:var(--ink2)}
.badge{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:4px;background:var(--surface2);color:var(--ink2)}
.badge.warn{background:var(--warn);color:#fff} .badge.ok{background:var(--ok);color:#fff}
.sw{width:14px;height:44px;border-radius:3px;flex:none}
.lnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.th{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--surface2);flex:none;border:1px solid var(--line)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs .th{width:64px;height:64px;cursor:pointer}
svg{display:block;max-width:100%;height:auto}
.zr{fill:transparent;stroke:var(--ink2);stroke-width:1;cursor:pointer}
.zr.sel{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.8}
.zl{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.06em;fill:var(--ink2);pointer-events:none;text-transform:uppercase}
.zd{fill:var(--warn);stroke:var(--surface);stroke-width:1.5;pointer-events:none}
.cab{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.tcap{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.bar{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.ok>i{background:var(--ok)}
.note{padding:10px 12px;border-radius:6px;background:var(--accent-soft);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.warnbox{background:transparent;border:1px solid var(--warn);color:var(--ink)}
.prow{display:grid;grid-template-columns:26px minmax(0,1fr) 40px;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.prow .pn{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink2);text-align:center}
.prow .p2{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prow .p2 .chk{grid-column:1/-1}
.wrow{display:grid;grid-template-columns:30px minmax(0,1fr) 96px 40px;gap:8px;align-items:center}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:8px}
.seg button{flex:1;min-height:40px;border:0;border-radius:6px;background:transparent;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:6px;color:var(--ink2);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet-body{position:relative;width:100%;max-width:620px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:14px 14px 0 0;border:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.sheet-head h3{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.sheet-content{overflow:auto;padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px}
.sheet-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-foot .btn{flex:1;min-width:110px}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px;min-height:48px}
.pick .gl{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .lbtn{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.warnline{font-size:14px;color:var(--warn);display:flex;gap:6px}
@media (min-width:700px){.sheet{align-items:center}.sheet-body{border-radius:14px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .12s}}
</style>

<div id="app">
  <header class="top">
    <div style="min-width:0"><div class="eyebrow">Cuaderno de obra</div><h1 id="ttl">Mi camión</h1><div class="tmeta" id="tmeta"></div></div>
    <button class="btn sm" id="menuBtn" data-act="menu" aria-label="Copia de seguridad y datos">Copia</button>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" aria-label="Secciones"></nav>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-act="sheet-close"></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="icon" data-act="sheet-close" aria-label="Cerrar">✕</button></div>
    <div class="sheet-content"></div>
    <div class="sheet-foot"></div>
  </div>
</div>
<div class="lb" id="lb" hidden>
  <img id="lbImg" alt="">
  <button class="lbtn" style="top:max(12px,env(safe-area-inset-top,0px));right:12px" data-act="lb-close" aria-label="Cerrar">✕</button>
  <button class="lbtn" style="left:12px" data-act="lb-prev" id="lbPrev" aria-label="Anterior">‹</button>
  <button class="lbtn" style="right:12px" data-act="lb-next" id="lbNext" aria-label="Siguiente">›</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d=0)=>(n==null||!isFinite(n))?'—':Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
/* Acepta 1.234,5 · 1234,5 · 1.234 · 1.5 · 1,5. Un punto seguido de 3 cifras (2.200) cuenta como miles. */
const parseN=v=>{
  if(v==null)return null;
  let t=String(v).trim().replace(/[\s\u00a0€]/g,'');
  if(t==='')return null;
  const c=t.includes(','),d=t.includes('.');
  if(c&&d){t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'')}
  else if(c){t=t.split(',').length>2?t.replace(/,/g,''):t.replace(',','.')}
  else if(d&&/^[1-9]\d{0,2}(\.\d{3})+$/.test(t)){t=t.replace(/\./g,'')}
  const n=parseFloat(t);return isFinite(n)?n:null;};
const fmtIn=v=>v==null?'':String(v).replace('.',',');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const byId=(a,id)=>a.find(x=>x.id===id);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDate=iso=>{try{return new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});}catch(e){return iso||'';}};
const fmtSize=b=>b>1048576?nf(b/1048576,1)+' MB':nf(Math.max(1,b/1024),0)+' KB';
const KEY='cuaderno-vario:v1';

/* ---------- catálogos ---------- */
const TIPOS={tratamiento:{n:'Tratamiento',c:'--c-trat'},acustico:{n:'Antivibración',c:'--c-acus'},aislante:{n:'Aislante',c:'--c-aisl'},barrera:{n:'Barrera de vapor',c:'--c-barr'},rastrel:{n:'Rastrel',c:'--c-rast'},panel:{n:'Panel',c:'--c-pane'},otro:{n:'Otro',c:'--c-otro'}};
const ZONAS=[
  {id:'techo',n:'Techo',c:'Techo',d:t=>[t.L,t.W]},
  {id:'izq',n:'Pared izquierda',c:'Izq.',d:t=>[t.L,t.H]},
  {id:'der',n:'Pared derecha',c:'Der.',d:t=>[t.L,t.H]},
  {id:'front',n:'Pared frontal (lado cabina)',c:'Frontal',d:t=>[t.W,t.H]},
  {id:'trasera',n:'Puerta trasera',c:'Trasera',d:t=>[t.W,t.H]},
  {id:'suelo',n:'Suelo',c:'Suelo',d:t=>[t.L,t.W]}
];
const zname=id=>{const z=ZONAS.find(z=>z.id===id);return z?z.n:'';};
const INSP_T={oxido:'Óxido',filtracion:'Filtración',golpe:'Golpe o abolladura',reforma:'Reforma anterior',otro:'Otro'};
const HUECO_T={ventana:{n:'Ventana',u:3},claraboya:{n:'Claraboya',u:3},puerta:{n:'Puerta',u:2},otro:{n:'Hueco u obstáculo',u:0}};
const DOC_C=['Ficha técnica','Manual','Factura','Plano','Referencia','Otro'];
const PESO_Q=['Agua','Aguas grises','Gas','Baterías','Personas','Muebles','Nevera','Equipaje'];
const PRESETS=[
  {nombre:'Convertidor de óxido + imprimación',tipo:'tratamiento',espesor:0,lambda:0,dens:0,precio:4,modo:'m2',nota:'Va antes que cualquier capa. Respeta el curado del fabricante.'},
  {nombre:'Butilo autoadhesivo',tipo:'acustico',espesor:2,lambda:0,dens:1500,precio:12,modo:'m2',nota:'Corta las vibraciones de la chapa.'},
  {nombre:'Elastomérico autoadhesivo 19 mm',tipo:'aislante',espesor:19,lambda:0.036,dens:60,precio:26,modo:'m2',entre:false,nota:'Celda cerrada, hace de barrera de vapor. Pegado continuo a la chapa.'},
  {nombre:'Lana de oveja 40 mm',tipo:'aislante',espesor:40,lambda:0.039,dens:20,precio:14,modo:'m2',entre:true,nota:'Regula la humedad. Comprueba el tratamiento antipolilla.'},
  {nombre:'Lana mineral 50 mm',tipo:'aislante',espesor:50,lambda:0.035,dens:40,precio:6,modo:'m2',entre:true,nota:'Económica. No puede mojarse.'},
  {nombre:'XPS 30 mm',tipo:'aislante',espesor:30,lambda:0.034,dens:33,precio:8,modo:'m2',entre:true,nota:'Rígido y de celda cerrada. Se corta a medida entre rastreles.'},

/* ---------- fotos y archivos (IndexedDB) ---------- */
const Photos=(function(){
  let db=null;const mem=new Map(),urls=new Map();
  const open=()=>new Promise(res=>{try{const r=indexedDB.open('cuaderno-vario',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{db=r.result;res(true);};r.onerror=()=>res(false);r.onblocked=()=>res(false);}catch(e){res(false);}});
  const st=m=>db.transaction('f',m).objectStore('f');
  const req=(fn)=>new Promise(res=>{try{const q=fn();q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);}catch(e){res(undefined);}});
  return{
    open,get ok(){return !!db;},
    async put(id,rec){if(!db){mem.set(id,rec);return false;}const r=await req(()=>st('readwrite').put(rec,id));if(r===undefined){mem.set(id,rec);return false;}return true;},
    async get(id){if(mem.has(id))return mem.get(id);if(!db)return null;return (await req(()=>st('readonly').get(id)))||null;},
    async del(id){mem.delete(id);if(urls.has(id)){try{URL.revokeObjectURL(urls.get(id));}catch(e){}urls.delete(id);}if(db)await req(()=>st('readwrite').delete(id));},
    async clear(){mem.clear();urls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});urls.clear();if(db)await req(()=>st('readwrite').clear());},
    async url(id){if(urls.has(id))return urls.get(id);const r=await this.get(id);if(!r||!r.blob)return null;const u=URL.createObjectURL(r.blob);urls.set(id,u);return u;}
  };
})();
async function shrink(file){
  if(!file.type||!file.type.startsWith('image/'))return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));return b||file;}catch(e){return file;}
}
async function storeFile(file){const id=uid();const isImg=file.type&&file.type.startsWith('image/');const blob=isImg?await shrink(file):file;
  const ok=await Photos.put(id,{blob,name:file.name||'archivo',type:blob.type||file.type||'application/octet-stream'});
  if(!ok&&!Photos.ok)toast('Este navegador no deja guardar archivos: se perderán al cerrar.');
  return{id,name:file.name||'archivo',type:blob.type||file.type||'',size:blob.size};}
function hydrate(root){$$('img[data-photo]',root||document).forEach(im=>{const id=im.dataset.photo;Photos.url(id).then(u=>{if(u)im.src=u;});});}

/* ---------- cálculo ---------- */
const hasDims=()=>S.truck.L>0&&S.truck.W>0&&S.truck.H>0;
function zonaArea(zid){
  const z=ZONAS.find(z=>z.id===zid);const [a,b]=z.d(S.truck);
  if(!(a>0&&b>0))return{gross:0,huecos:0,net:0,a:a||0,b:b||0};
  const gross=a*b/1e6;const hu=S.huecos.filter(h=>h.zona===zid).reduce((s,h)=>s+(h.ancho||0)*(h.alto||0)*(h.cant||1)/1e6,0);
  return{gross,huecos:hu,net:Math.max(0,gross-hu),a,b};
}
function calcCapa(c,A,m){
  const f=1+(m||0)/100;
  if(c.modo==='ml'){const ml=c.sep>0?A/(c.sep/1000):0;const L=ml*f;return{qty:L,u:'m',coste:L*(c.precio||0),peso:ml*((c.ancho||0)*(c.espesor||0)/1e6)*(c.dens||0)};}
  const q=A*f;return{qty:q,u:'m²',coste:q*(c.precio||0),peso:A*(c.dens||0)*(c.espesor||0)/1000};
}
function calcZona(zid){
  const ar=zonaArea(zid),A=ar.net,L=S.capas[zid]||[];
  const rast=L.find(c=>c.tipo==='rastrel'&&c.modo==='ml');
  const f=rast&&rast.sep>0?Math.min(1,(rast.ancho||0)/rast.sep):0,lamR=rast&&rast.lambda>0?rast.lambda:0.13;
  let R=0.17,coste=0,peso=0,other=0,entre=0;const warns=[];
  L.forEach(c=>{const r=calcCapa(c,A,S.merma);coste+=r.coste;peso+=r.peso;if(c===rast)return;
    const lam=c.lambda||0,inPlane=!!rast&&c.entre&&c.tipo==='aislante';
    if(inPlane){entre+=c.espesor||0;if(lam>0)R+=(c.espesor/1000)/(f*lamR+(1-f)*lam);}
    else{other+=c.espesor||0;if(lam>0)R+=(c.espesor/1000)/lam;}});
  const planeT=rast?Math.max(rast.espesor||0,entre):0;
  if(rast&&entre>(rast.espesor||0))warns.push('El aislante entre rastreles ('+nf(entre,0)+' mm) es más grueso que el rastrel ('+nf(rast.espesor,0)+' mm).');
  return{A,gross:ar.gross,huecos:ar.huecos,coste,peso,R,U:1/R,total:other+planeT,warns,f};
}
function calcTodo(){
  let coste=0,peso=0,UA=0;const rows=[];
  ZONAS.forEach(z=>{const c=calcZona(z.id);coste+=c.coste;peso+=c.peso;UA+=c.A*c.U;rows.push({z,c});});
  let UAh=0;S.huecos.forEach(h=>{UAh+=((h.ancho||0)*(h.alto||0)*(h.cant||1)/1e6)*(h.u||0);});
  return{coste,peso,UA:UA+UAh,UAh,rows,W:(UA+UAh)*(S.dT||0)};
}
function pendByZona(){const o={};S.insp.forEach(i=>{if(i.estado!=='tratado')o[i.zona]=(o[i.zona]||0)+1;});return o;}

/* ---------- despiece de tableros ---------- */
function splitLen(len,max){const o=[];let r=len;while(r>max){o.push(max);r-=max;}if(r>0)o.push(Math.round(r));return o;}
function genPiezas(zid,t,tb){
  const z=ZONAS.find(z=>z.id===zid);const [a,b]=z.d(t);if(!(a>0&&b>0))return[];
  const opts=[[tb.W,tb.H],[tb.H,tb.W]].map(([ma,mb])=>{const xs=splitLen(a,ma),ys=splitLen(b,mb);return{xs,ys,n:xs.length*ys.length};});
  const best=opts[0].n<=opts[1].n?opts[0]:opts[1];const map=new Map();
  best.xs.forEach(x=>best.ys.forEach(y=>{const k=x+'x'+y;map.set(k,(map.get(k)||{w:x,h:y,n:0}));map.get(k).n++;}));
  let i=0;return Array.from(map.values()).map(p=>({id:uid(),nombre:z.c+(map.size>1?' '+(++i):''),w:p.w,h:p.h,n:p.n,fija:false}));
}
function splitFree(fr,r){
  if(r.x>=fr.x+fr.w||r.x+r.w<=fr.x||r.y>=fr.y+fr.h||r.y+r.h<=fr.y)return[fr];
  const o=[];
  if(r.x>fr.x)o.push({x:fr.x,y:fr.y,w:r.x-fr.x,h:fr.h});
  if(r.x+r.w<fr.x+fr.w)o.push({x:r.x+r.w,y:fr.y,w:fr.x+fr.w-(r.x+r.w),h:fr.h});
  if(r.y>fr.y)o.push({x:fr.x,y:fr.y,w:fr.w,h:r.y-fr.y});
  if(r.y+r.h<fr.y+fr.h)o.push({x:fr.x,y:r.y+r.h,w:fr.w,h:fr.y+fr.h-(r.y+r.h)});
  return o;
}
function tryPlace(sh,it,canRot,k){
  let best=null;
  sh.free.forEach(fr=>{[[it.w,it.h,false],[it.h,it.w,true]].forEach(([w,h,rot])=>{
    if(rot&&!canRot)return;const pw=w+k,ph=h+k;
    if(pw<=fr.w&&ph<=fr.h){const s=Math.min(fr.w-pw,fr.h-ph),l=Math.max(fr.w-pw,fr.h-ph);
      if(!best||s<best.s||(s===best.s&&l<best.l))best={s,l,x:fr.x,y:fr.y,w,h,pw,ph,rot};}});});
  if(!best)return false;
  const r={x:best.x,y:best.y,w:best.pw,h:best.ph};let nf2=[];
  sh.free.forEach(fr=>nf2.push(...splitFree(fr,r)));
  nf2=nf2.filter((a,i)=>!nf2.some((b,j)=>i!==j&&a.x>=b.x&&a.y>=b.y&&a.x+a.w<=b.x+b.w&&a.y+a.h<=b.y+b.h&&(i>j||a.w*a.h<b.w*b.h)));
  sh.free=nf2;sh.placed.push({x:best.x,y:best.y,w:best.w,h:best.h,pi:it.pi,rot:best.rot});return true;
}
function packAll(){
  const T=S.tableros,SW=T.W,SH=T.H,k=T.kerf||0;
  const out={sheets:[],fail:[],used:0,ok:SW>0&&SH>0,inc:0};if(!out.ok)return out;
  const items=[];
  T.piezas.forEach((p,pi)=>{if(!(p.w>0&&p.h>0)){out.inc++;return;}for(let i=0;i<Math.max(1,Math.round(p.n||1));i++)items.push({pi,w:p.w,h:p.h,fija:p.fija});});
  items.sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)||b.w*b.h-a.w*a.h);
  items.forEach(it=>{
    const canRot=T.rotar&&!it.fija;
    if(!((it.w<=SW&&it.h<=SH)||(canRot&&it.h<=SW&&it.w<=SH))){out.fail.push(it);return;}
    out.used+=it.w*it.h;
    for(const sh of out.sheets){if(tryPlace(sh,it,canRot,k))return;}
    const sh={free:[{x:0,y:0,w:SW+k,h:SH+k}],placed:[]};out.sheets.push(sh);tryPlace(sh,it,canRot,k);
  });
  return out;
}

SHELL.capas=()=>`
<div class="chips" data-r="chips"></div>
<div data-r="zsum"></div>
<div class="card">
  <div class="cardhead"><h2 class="sec" data-r="ztitle"></h2></div>
  <div data-r="stack"></div>

</div>
<div class="card">
  <h2 class="sec">Toda la caja</h2>
  <div class="grid2">${numField('Merma de material','merma','%')}
    <label class="fld"><span>Diferencia de temperatura</span><input type="range" min="5" max="40" step="1" value="${S.dT}" data-bind="dT" data-t="n" data-live></label></div>
  <div data-r="total" style="display:flex;flex-direction:column;gap:12px"></div>
</div>`;
function stackSVG(zid){
  const L=S.capas[zid]||[];
  if(!L.length)return '<div class="empty">Añade la primera capa: se dibuja el corte desde la chapa (izquierda) hacia el interior (derecha).</div>';
  const rast=L.find(c=>c.tipo==='rastrel'&&c.modo==='ml');
  const els=[{k:'chapa',mm:1.5,w:8}];let planeDone=false,n=0;
  const entreL=L.filter(c=>rast&&c.entre&&c.tipo==='aislante');
  const planeMM=rast?Math.max(rast.espesor||0,entreL.reduce((s,c)=>s+(c.espesor||0),0)):0;
  L.forEach(c=>{n++;
    const inPlane=rast&&(c===rast||(c.entre&&c.tipo==='aislante'));
    if(inPlane){if(planeDone)return;planeDone=true;els.push({k:'plane',mm:planeMM,ns:L.map((x,i)=>(x===rast||(x.entre&&x.tipo==='aislante'))?i+1:0).filter(Boolean)});return;}
    els.push({k:'layer',c,mm:c.espesor||0,n});
  });
  const avail=296,minW=7;let tot=els.reduce((s,e)=>s+Math.max(e.mm,0),0)||1,k=avail/tot;
  for(let i=0;i<6;i++){const sum=els.reduce((s,e)=>s+(e.k==='chapa'?e.w:Math.max(minW,e.mm*k)),0);if(sum<=avail)break;k*=avail/sum*0.97;}
  let x=20;const y0=18,H=92,out=[];
  els.forEach(e=>{
    const w=e.k==='chapa'?e.w:Math.max(minW,e.mm*k);
    if(e.k==='chapa')out.push(`<rect x="${x}" y="${y0}" width="${w}" height="${H}" fill="var(--chapa)"/>`);
    else if(e.k==='layer')out.push(`<rect x="${x.toFixed(1)}" y="${y0}" width="${w.toFixed(1)}" height="${H}" style="fill:var(${TIPOS[e.c.tipo].c})" stroke="var(--surface)" stroke-width=".8"/>${w>=10?`<text x="${(x+w/2).toFixed(1)}" y="${y0-5}" text-anchor="middle" class="zl" style="font-size:10px">${e.n}</text>`:''}`);
    else{
      const rh=16,inn=L.filter(c=>c.entre&&c.tipo==='aislante');let ix=x;
      out.push(`<rect x="${x.toFixed(1)}" y="${y0}" width="${w.toFixed(1)}" height="${rh}" style="fill:var(--c-rast)"/><rect x="${x.toFixed(1)}" y="${y0+H-rh}" width="${w.toFixed(1)}" height="${rh}" style="fill:var(--c-rast)"/>`);
      inn.forEach(c=>{const iw=Math.max(3,(c.espesor||0)*k);out.push(`<rect x="${ix.toFixed(1)}" y="${y0+rh}" width="${iw.toFixed(1)}" height="${H-2*rh}" style="fill:var(${TIPOS[c.tipo].c})" stroke="var(--surface)" stroke-width=".6"/>`);ix+=iw;});
      out.push(`<text x="${(x+w/2).toFixed(1)}" y="${y0-5}" text-anchor="middle" class="zl" style="font-size:10px">${e.ns.join('·')}</text>`);
    }
    x+=w;
  });
  return `<svg viewBox="0 0 340 134" role="img" aria-label="Corte de las capas"><text x="20" y="128" class="zl">Chapa · exterior</text><text x="${(x).toFixed(1)}" y="128" text-anchor="end" class="zl">Interior</text>${out.join('')}</svg>`;
}
REG.capas={
  chips:chipsHTML,
  ztitle(){return zname(S.zona);},
  zsum(){
    const c=calcZona(S.zona);
    if(!(c.gross>0))return '<div class="empty">Introduce las medidas de la caja en la pestaña Camión para calcular superficies.</div>';
    return `<div class="tiles">${tile('Superficie neta',nf(c.A,2),'m²')}${tile('Grosor total',nf(c.total,0),'mm')}${tile('R / U',nf(c.R,2)+' / '+nf(c.U,2),'')}${tile('Peso',nf(c.peso,0),'kg')}${tile('Coste',nf(c.coste,0),'€')}</div>`;
  },
  stack(){return stackSVG(S.zona);},
  layers(){
    const L=S.capas[S.zona],c=calcZona(S.zona),A=c.A;
    let h=c.warns.map(w=>`<div class="warnline">⚠ ${esc(w)}</div>`).join('');
    h+=L.map((l,i)=>{const r=calcCapa(l,A,S.merma);const T=TIPOS[l.tipo];
      const meta=[T.n,l.modo==='ml'?nf(l.ancho)+'×'+nf(l.espesor)+' mm · cada '+nf(l.sep)+' mm':(l.espesor?nf(l.espesor,1)+' mm':''),l.lambda?'λ '+nf(l.lambda,3):''].filter(Boolean).join(' · ');
      return `<div class="item"><span class="lnum">${i+1}</span><span class="sw" style="background:var(${T.c})"></span>
        <div class="main"><b>${esc(l.nombre||T.n)}</b><span class="meta">${meta}</span><span class="meta">${A>0?nf(r.qty,1)+' '+r.u+' con merma · '+nf(r.coste,0)+' € · '+nf(r.peso,1)+' kg':'—'}</span></div>
        <div class="btns" style="flex-direction:column"><div style="display:flex;gap:6px"><button class="icon sm" data-act="layer-up" data-id="${l.id}" aria-label="Subir" ${i===0?'disabled':''}>↑</button><button class="icon sm" data-act="layer-down" data-id="${l.id}" aria-label="Bajar" ${i===L.length-1?'disabled':''}>↓</button></div><button class="icon sm" style="width:auto" data-act="layer-edit" data-id="${l.id}" aria-label="Editar">✎</button></div></div>`;}).join('');
    h+=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="layer-add">Añadir capa</button><button class="btn" data-act="layer-copy">Copiar de otra zona</button></div><p class="hint">Orden: de la chapa hacia el interior. Valores de partida orientativos; edítalos con tus materiales y precios.</p>`;
    return h;
  },
  total(){
    const T=calcTodo();
    const rows=T.rows.map(({z,c})=>`<tr><td>${z.c}</td><td>${nf(c.A,1)}</td><td>${nf(c.U,2)}</td><td>${nf(c.peso,0)}</td><td>${nf(c.coste,0)}</td></tr>`).join('');
    return `<div class="tiles">${tile('Coste',nf(T.coste,0),'€')}${tile('Peso de la obra',nf(T.peso,0),'kg')}${tile('Pérdida UA',nf(T.UA,0),'W/K')}${tile('A '+S.dT+' K',nf(T.W,0),'W')}</div>
      <p class="hint">Con ${S.dT} °C de diferencia entre dentro y fuera se pierden unos ${nf(T.W,0)} W (${nf(T.W*24/1000,1)} kWh al día). Incluye ventanas y claraboyas; no cuenta infiltraciones ni la cabina. Cálculo orientativo con los puentes térmicos de los rastreles.</p>
      <div class="tablewrap"><table><thead><tr><th>Zona</th><th>m²</th><th>U</th><th>kg</th><th>€</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
};

REG.tableros={
  piezas(){
    const P=S.tableros.piezas;
    if(!P.length)return '<div class="empty">Añade las piezas que necesitas cortar, o genéralas a partir de una zona de la caja.</div>';

        <label class="num"><input inputmode="numeric" data-t="n" data-bind="tableros.piezas.${i}.h" value="${fmtIn(p.h)}" placeholder="Alto" aria-label="Alto"><i class="u">mm</i></label>
        <label class="num"><input inputmode="numeric" data-t="n" data-bind="tableros.piezas.${i}.n" value="${fmtIn(p.n)}" placeholder="Uds" aria-label="Cantidad"><i class="u">uds</i></label>
        <label class="chk"><input type="checkbox" data-t="c" data-bind="tableros.piezas.${i}.fija" ${p.fija?'checked':''}> Veta fija: no girar</label>
      </div></div>`).join('');
  },
  result(){
    const T=S.tableros,R=packAll();
    if(!R.ok)return '<div class="empty">Indica el tamaño del tablero.</div>';
    if(!T.piezas.length)return '';
    const area=R.sheets.length*T.W*T.H,util=area?R.used/area*100:0,n=R.sheets.length;

    if(R.fail.length)h+=`<div class="warnline">⚠ ${R.fail.length} pieza(s) no caben en el tablero: ${Array.from(new Set(R.fail.map(f=>'#'+(f.pi+1)))).join(', ')}.</div>`;
    if(R.inc)h+=`<div class="warnline">⚠ ${R.inc} pieza(s) sin medidas completas, no se cuentan.</div>`;
    h+=`<p class="hint">Reparto orientativo. Comprueba el orden de cortes antes de serrar: el programa no garantiza cortes pasantes de lado a lado.</p></div>`;
    R.sheets.forEach((sh,si)=>{
      const u=sh.placed.reduce((s,p)=>s+p.w*p.h,0)/(T.W*T.H)*100,fs=T.H/12;
      h+=`<div class="card"><div class="cardhead"><h3 class="sub">Tablero ${si+1}</h3><span class="muted">${nf(u,0)} % usado</span></div>

        return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${(p.pi+j)%2?'var(--accent-soft)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`+(big?`<text x="${p.x+p.w/2}" y="${p.y+p.h/2+(dim?-fs*.1:fs*.35)}" text-anchor="middle" class="zl" style="font-size:${fs}px;fill:var(--ink)">#${p.pi+1}</text>`:'')+(big&&dim?`<text x="${p.x+p.w/2}" y="${p.y+p.h/2+fs*1.05}" text-anchor="middle" class="zl" style="font-size:${fs*.7}px">${p.w}×${p.h}</text>`:'');}).join('')}</svg></div>`;
    });
    return h;
  }
};

let SHEET=null;
function openSheet(o){
  SHEET=o;$('#sheetTitle').textContent=o.title;$('#sheet .sheet-content').innerHTML=o.body;
  const foot=$('#sheet .sheet-foot');foot.innerHTML='';
  (o.actions||[]).forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;
    b.onclick=async()=>{
      if(a.confirm&&!b.dataset.armed){b.dataset.armed='1';b.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{delete b.dataset.armed;b.textContent=a.label;},3500);return;}
      b.disabled=true;try{const r=await a.fn();if(r!==false)closeSheet();}catch(err){console.error(err);toast('No se pudo completar: '+(err&&err.message||err));}b.disabled=false;};
    foot.appendChild(b);});

}

const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});
function dataURLToBlob(u){const [h,b]=u.split(',');const m=/data:([^;]*)/.exec(h);const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m?m[1]:''});}
function photoIds(){const ids=[];S.insp.forEach(i=>ids.push(...(i.fotos||[])));S.diario.forEach(d=>ids.push(...(d.fotos||[])));S.docs.forEach(d=>{if(d.fileId)ids.push(d.fileId);});return ids;}
async function exportBackup(){
  const fotos={};for(const id of photoIds()){const r=await Photos.get(id);if(r&&r.blob)fotos[id]={name:r.name,type:r.type,data:await blobToDataURL(r.blob)};}
  const data=JSON.stringify({app:'cuaderno-vario',v:1,fecha:new Date().toISOString(),state:S,fotos});
  const filename='cuaderno-vario-'+today()+'.json';
  try{
    const r=await saveBlob(filename,new Blob([data],{type:'application/json'}));
    if(r==='cancelado')return false;
    S.lastBackup=Date.now();save();renderHeader();toast('Copia guardada');}
  catch(e){toast('No se pudo guardar la copia');return false;}
}
/* en el móvil abre el menú de compartir (guardar en Archivos, WhatsApp, correo); en ordenador descarga el archivo */
async function saveBlob(name,blob){
  try{
    const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'compartido';}
  }catch(e){if(e&&e.name==='AbortError')return 'cancelado';}
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
  return 'descargado';
}
async function importBackup(file){
  try{const o=JSON.parse(await file.text());if(o.app!=='cuaderno-vario'||!o.state)throw new Error('No es una copia de este cuaderno');
    await Photos.clear();for(const id in (o.fotos||{})){const f=o.fotos[id];await Photos.put(id,{blob:dataURLToBlob(f.data),name:f.name,type:f.type});}
    S=mergeDef(o.state,blank());S.ejemplo=false;TAB=S.tab||'camion';save();renderAll();toast('Copia restaurada');return true;
  }catch(e){toast('No se pudo leer la copia: '+(e.message||e));return false;}
}
function menu(){
  const last=S.lastBackup?'Última copia: '+new Date(S.lastBackup).toLocaleDateString('es-ES',{day:'numeric',month:'long'}):'Todavía no has hecho ninguna copia.';
  openSheet({title:'Copia y datos',body:`<p>Todo se guarda en este navegador, en este dispositivo. Si borras los datos del navegador o cambias de móvil, se pierde. Haz una copia de vez en cuando.</p><p class="hint">${last}</p>
    <button class="btn primary" id="m_exp">Guardar copia (incluye fotos)</button>
    <div class="fld"><span class="lbl">Restaurar una copia</span><input type="file" id="m_imp" accept=".json,application/json"></div>
    <button class="btn danger" data-act="reset-ask">Empezar de cero</button>`,
    onOpen(){$('#m_exp').onclick=async()=>{const r=await exportBackup();if(r!==false)closeSheet();};
      $('#m_imp').onchange=async e=>{const f=e.target.files[0];if(f&&await importBackup(f))closeSheet();};},
    actions:[{label:'Cerrar',cls:'ghost',fn:()=>{}}]});
}
function resetAsk(){
  openSheet({title:'Empezar de cero',body:'<p>Se borran las medidas, capas, piezas, diario, archivos, fotos y gastos de este dispositivo. No se puede deshacer. Si no tienes una copia, guárdala antes.</p>',
    actions:[cancelA,{label:'Borrar todo',cls:'danger',confirm:true,async fn(){await Photos.clear();S=blank();TAB='camion';save();renderAll();toast('Cuaderno en blanco');}}]});
}

/* ---------- lightbox ---------- */
let LB={ids:[],i:0};
async function lbShow(){const u=await Photos.url(LB.ids[LB.i]);$('#lbImg').src=u||'';$('#lbPrev').hidden=$('#lbNext').hidden=LB.ids.length<2;}
function lbOpen(ids,i){LB={ids,i};$('#lb').hidden=false;document.body.classList.add('noscroll');lbShow();}
function lbClose(){$('#lb').hidden=true;if(!SHEET)document.body.classList.remove('noscroll');}

/* ---------- acciones ---------- */
function commit(){save();renderBanner();if(!$('#nav'))return;fillAll();renderHeader();}
function renderAll(){renderHeader();renderBanner();renderTab();}
function swap(arr,id,d){const i=arr.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];}
const ACT={
  tab(el){TAB=S.tab=el.dataset.t;save();renderTab();window.scrollTo(0,0);},
  zona(el){S.zona=el.dataset.z;save();refreshLive();},
  'go-capas'(){TAB=S.tab='capas';save();renderTab();window.scrollTo(0,0);},
  menu,'reset-ask':resetAsk,
  'sheet-close':closeSheet,'lb-close':lbClose,
  'lb-prev'(){LB.i=(LB.i+LB.ids.length-1)%LB.ids.length;lbShow();},'lb-next'(){LB.i=(LB.i+1)%LB.ids.length;lbShow();},
  foto(el){lbOpen(el.dataset.ids.split(','),+el.dataset.i||0);},
  'sh-rmfoto'(el){const d=SHEET&&SHEET.draft;if(!d)return;d.fotos=d.fotos.filter(x=>x!==el.dataset.id);d.removed.push(el.dataset.id);el.parentElement.remove();},
  'hueco-add'(){hueco();},'hueco-edit'(el){hueco(el.dataset.id);},
  'insp-add'(el){insp(null,el.dataset.z);},'insp-edit'(el){insp(el.dataset.id);},
  'insp-toggle'(el){const i=byId(S.insp,el.dataset.id);i.estado=i.estado==='tratado'?'pendiente':'tratado';commit();},
  'layer-add':layerPicker,'layer-copy':layerCopy,'layer-edit'(el){layerEdit(el.dataset.id);},
  'layer-up'(el){swap(S.capas[S.zona],el.dataset.id,-1);commit();},'layer-down'(el){swap(S.capas[S.zona],el.dataset.id,1);commit();},
  addpreset(el){const p=PRESETS[+el.dataset.i];S.capas[S.zona].push(newLayer(p));closeSheet();commit();toast('Añadida a '+zname(S.zona));},
  addcustom(){const l=newLayer({nombre:'Nueva capa',tipo:'otro'});S.capas[S.zona].push(l);closeSheet();commit();layerEdit(l.id);},
  copyfrom(el){S.capas[S.zona]=S.capas[el.dataset.z].map(l=>Object.assign({},l,{id:uid()}));closeSheet();commit();toast('Capas copiadas');},
  tsize(el){S.tableros.W=+el.dataset.w;S.tableros.H=+el.dataset.h;save();$('#tbW').value=el.dataset.w;$('#tbH').value=el.dataset.h;refreshLive();},
  'pieza-add'(){S.tableros.piezas.push({id:uid(),nombre:'',w:null,h:null,n:1,fija:false});save();refresh('piezas','result');},
  'pieza-del'(el){S.tableros.piezas.splice(+el.dataset.i,1);save();refresh('piezas','result');},
  'piezas-gen':piezasGen,
  gen(el){const p=genPiezas(el.dataset.z,S.truck,S.tableros);S.tableros.piezas.push(...p);closeSheet();save();refresh('piezas','result');toast(p.length+' tipo(s) de pieza añadidos');},
  'peso-add'(){S.peso.items.push({id:uid(),nombre:'',kg:null,inc:true});save();refresh('items');},
  'peso-quick'(el){S.peso.items.push({id:uid(),nombre:el.dataset.n,kg:null,inc:true});save();refresh('items');},
  'peso-del'(el){S.peso.items.splice(+el.dataset.i,1);save();refresh('items','res');},
  'obra-tab'(el){S.obraTab=el.dataset.t;save();refresh('sub');},
  'fase-add'(){fase();},'fase-edit'(el){fase(el.dataset.id);},
  'fase-toggle'(el){const f=byId(S.fases,el.dataset.id);f.ok=!f.ok;commit();},
  'fase-up'(el){swap(S.fases,el.dataset.id,-1);commit();},'fase-down'(el){swap(S.fases,el.dataset.id,1);commit();},
  'diario-add'(){diario();},'diario-edit'(el){diario(el.dataset.id);},
  'doc-add'(){doc();},'doc-edit'(el){doc(el.dataset.id);},'doc-cat'(el){S.docCat=el.dataset.c;save();refresh('sub');},
  async 'doc-open'(el){const d=byId(S.docs,el.dataset.id),r=await Photos.get(d.fileId);if(!r){toast('No encuentro el archivo');return;}
    try{await saveBlob(d.nombre||'archivo',r.blob);}catch(e){toast('No se pudo guardar el archivo');}},
  'gasto-add'(){gasto();},'gasto-edit'(el){gasto(el.dataset.id);},
  'gasto-toggle'(el){const g=byId(S.gastos,el.dataset.id);g.estado=g.estado==='comprado'?'pendiente':'comprado';commit();}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e);}});
function bind(t){
  const p=t.dataset.bind,ty=t.dataset.t;let v=t.value;
  if(ty==='n')v=parseN(v);else if(ty==='c')v=t.checked;
  setP(p,v);save();refreshLive();
}
document.addEventListener('change',e=>{const t=e.target.closest('[data-bind]');if(t)bind(t);});
document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('[data-live]'))bind(t);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#lb').hidden)lbClose();else if(SHEET)closeSheet();}});

/* ---------- arranque ---------- */
async function init(){
  try{await Photos.open();}catch(e){}
  S=load();TAB=S.tab||'camion';if(!SHELL[TAB])TAB='camion';
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  renderAll();save();
}
init();
})();
</script>
